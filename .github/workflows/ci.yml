name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Build image
        run: docker compose build

      - name: Lint (ruff) and type-check (mypy)
        run: just lint

      - name: Tests
        run: just test

      - name: OpenAPI schema is up to date
        run: |
          just openapi
          git diff --exit-code -- openapi/schema.yaml || {
            echo "::error::openapi/schema.yaml is stale. Run 'just openapi' and commit the result."
            exit 1
          }

      - name: Django deploy checks (prod settings)
        run: just deploy-check

      - name: Stop stack
        if: always()
        run: docker compose down -v

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install (lockfile only)
        run: npm ci

      - name: Generated API client matches the backend schema
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/generated || {
            echo "::error::src/api/generated is stale. Run 'npm run gen:api' in mobile/ and commit the result."
            exit 1
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests
        run: npm test -- --ci

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --verbose --exit-code 1
