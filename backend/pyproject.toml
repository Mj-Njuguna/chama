[project]
name = "chama-backend"
version = "0.1.0"
description = "Chama bookkeeping and governance API (modular monolith)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.2",
    "gunicorn>=23.0",
    "structlog>=24.4",
    "phonenumbers>=9.0",  # upgrades: review phone vectors (tests/test_phones.py, VECTORS_REVIEWED_WITH)
    "argon2-cffi>=23.1",  # server step-up PIN hashing (Argon2id, ADR-0007)
    "cryptography>=44.0",  # field encryption, AES-256-GCM + HKDF (SEC-02, ADR-0011)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "pre-commit>=4.0",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "DJ",           # django
    "S",            # bandit
    "DTZ",          # naive datetimes (invariant 2: store UTC)
    "T20",          # no print()
    "SIM", "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"**/tests/**" = ["S101", "S105", "S106"]
# Django's Migration API is class attributes holding lists.
"**/migrations/*.py" = ["RUF012", "E501"]  # generated code

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
# No approved stub package for Celery/kombu yet; typed at our call sites instead.
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "apps.*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
# Celery decorators are untyped (no stubs); test tasks use them directly.
disallow_untyped_decorators = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
# --ds (not the DJANGO_SETTINGS_MODULE ini key): the container env sets DJANGO_SETTINGS_MODULE=dev,
# and pytest-django lets the env var beat the ini key but not the command-line flag.
testpaths = ["tests", "apps", "core"]
addopts = "--ds=config.settings.test -ra --strict-markers --cov=. --cov-report=term-missing:skip-covered"
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
omit = ["*/migrations/*", "config/wsgi.py", "config/asgi.py", "manage.py"]
