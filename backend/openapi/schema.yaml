          minimum: 1
        received_on:
          type: string
          format: date
          description: Date on the slip (Africa/Nairobi).
        member_id:
          type: string
          format: uuid
          nullable: true
          description: Omit to leave it for the resolver.
        note:
          type: string
          default: ''
          maxLength: 200
      required:
      - amount_minor
      - channel
      - received_on
      - reference
    ReceiptList:
      type: object
      properties:
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptOut'
      required:
      - receipts
    ReceiptOut:
      type: object
      properties:
        receipt_id:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/ReceiptChannelEnum'
        reference:
          type: string
        amount_minor:
          type: integer
        received_on:
          type: string
          format: date
        member_id:
          type: string
          format: uuid
          nullable: true
        note:
          type: string
        recorded_by_member_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
      required:
      - amount_minor
      - channel
      - created_at
      - member_id
      - note
      - receipt_id
      - received_on
      - recorded_by_member_id
      - reference
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - refresh_token
    RoleEnum:
      enum:
      - chair
      - treasurer
      - secretary
      - member
      type: string
      description: |-
        * `chair` - Chair
        * `treasurer` - Treasurer
        * `secretary` - Secretary
        * `member` - Member
    RosterImportRequest:
      type: object
      properties:
        csv:
          type: string
          minLength: 1
          description: 'CSV text with a header row: name, phone, and optionally role.'
        commit:
          type: boolean
          default: false
          description: 'false: check only (no step-up). true: invite every valid row
            (fresh OTP).'
      required:
      - csv
    RosterResult:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RosterRow'
        valid:
          type: integer
        invalid:
          type: integer
        invited:
          type: integer
          description: Invitations created (commit only).
      required:
      - invalid
      - invited
      - rows
      - valid
    RosterRow:
      type: object
      properties:
        row:
          type: integer
          description: Line number in the file, header = 1.
        name:
          type: string
        phone:
          type: string
        role:
          type: string
        error:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ErrorEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - error
      - name
      - phone
      - role
      - row
    SecurityEventOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        kind:
          type: string
        user_id:
          type: string
          format: uuid
          nullable: true
        device_id:
          type: string
          format: uuid
          nullable: true
        metadata:
          type: object
          additionalProperties: {}
      required:
      - device_id
      - id
      - kind
      - metadata
      - occurred_at
      - user_id
    SecurityEvents:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/SecurityEventOut'
      required:
      - events
    SourceEnum:
      enum:
      - c2b
      - stk
      type: string
      description: |-
        * `c2b` - c2b
        * `stk` - stk
    StepUpFactorEnum:
      enum:
      - otp
      - pin
      type: string
      description: |-
        * `otp` - otp
        * `pin` - pin
    StepUpOtpVerifyRequest:
      type: object
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 12
      required:
      - challenge_id
      - code
    StkInRequest:
      type: object
      properties:
        amount_minor:
          type: integer
          maximum: 15000000
          minimum: 100
          description: Whole shillings only (a multiple of 100).
      required:
      - amount_minor
    StkRequest:
      type: object
      properties:
        stk_request_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/StkStatusEnum'
        amount_minor:
          type: integer
        mpesa_receipt:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - amount_minor
      - created_at
      - mpesa_receipt
      - status
      - stk_request_id
    StkStatusEnum:
      enum:
      - pending
      - succeeded
      - failed
      - cancelled
      - timeout
      type: string
      description: |-
        * `pending` - Pending
        * `succeeded` - Succeeded
        * `failed` - Failed
        * `cancelled` - Cancelled
        * `timeout` - Timeout
    Suggestion:
      type: object
      properties:
        member_id:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/SuggestionReasonEnum'
      required:
      - member_id
      - reason
    SuggestionReasonEnum:
      enum:
      - similar_code
      - phone_pattern
      type: string
      description: |-
        * `similar_code` - similar_code
        * `phone_pattern` - phone_pattern
    SwitchChamaRequest:
      type: object
      properties:
        chama_id:
          type: string
          format: uuid
      required:
      - chama_id
    SwitchedChama:
      type: object
      properties:
        active_chama_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - active_chama_id
      - role
    TokenPair:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        access_token:
          type: string
        access_expires_in:
          type: integer
          description: Seconds.
        refresh_token:
          type: string
        refresh_expires_in:
          type: integer
          description: Seconds.
      required:
      - access_expires_in
      - access_token
      - refresh_expires_in
      - refresh_token
      - session_id
    TokenTypeEnum:
      enum:
      - expo
      - fcm
      type: string
      description: |-
        * `expo` - expo
        * `fcm` - fcm
    UnallocatedList:
      type: object
      properties:
        payments:
          type: array
          items:
            $ref: '#/components/schemas/UnallocatedPayment'
      required:
      - payments
    UnallocatedPayment:
      type: object
      properties:
        payment_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
          nullable: true
        amount_minor:
          type: integer
        mpesa_receipt:
          type: string
        received_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/PaymentStateEnum'
        payer_masked:
          type: string
        bill_ref:
          type: string
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/Suggestion'
        source:
          $ref: '#/components/schemas/SourceEnum'
      required:
      - amount_minor
      - bill_ref
      - member_id
      - mpesa_receipt
      - payer_masked
      - payment_id
      - received_at
      - source
      - status
      - suggestions
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      description: Opaque access token (chm_at_...) from /auth/otp/verify or /auth/token/refresh.
        Valid 15 minutes.
