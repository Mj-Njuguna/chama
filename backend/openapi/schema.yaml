components:
  schemas:
    AcceptRequest:
      type: object
      properties:
        accept_terms:
          type: boolean
          description: 'Must be true: the invite terms.'
        scheduled_stk_opt_in:
          type: boolean
          default: true
          description: Receive an M-Pesa prompt on the morning a contribution is due.
      required:
      - accept_terms
    Accepted:
      type: object
      properties:
        chama_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/RoleEnum'
        member_code:
          type: string
      required:
      - chama_id
      - member_code
      - role
    AllocateInRequest:
      type: object
      properties:
        member_id:
          type: string
          format: uuid
      required:
      - member_id
    ChamaHome:
      type: object
      description: Values are null until the module that computes them is live.
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        member:
          allOf:
          - $ref: '#/components/schemas/HomeMember'
          nullable: true
        official:
          allOf:
          - $ref: '#/components/schemas/HomeOfficial'
          nullable: true
          description: Present only for officials (chair, treasurer, secretary).
      required:
      - member
      - official
      - role
    ChamaList:
      type: object
      properties:
        chamas:
          type: array
          items:
            $ref: '#/components/schemas/ChamaSummary'
        active_chama_id:
          type: string
          format: uuid
          nullable: true
      required:
      - active_chama_id
      - chamas
    ChamaSummary:
      type: object
      properties:
        chama_id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        status:
          $ref: '#/components/schemas/MembershipStatusEnum'
      required:
      - chama_id
      - name
      - role
      - status
    ConstitutionOut:
      type: object
      properties:
        contribution_frequency:
          $ref: '#/components/schemas/ContributionFrequencyEnum'
        contribution_amount_minor:
          type: integer
          minimum: 0
          description: Base contribution per cycle, KES minor units (cents).
        due_day:
          type: integer
          minimum: 0
          description: 'Monthly: day of month 1-28. Weekly: 0 = Monday ... 6 = Sunday.'
        grace_days:
          type: integer
          maximum: 30
          minimum: 0
        penalty_type:
          $ref: '#/components/schemas/PenaltyTypeEnum'
        penalty_flat_minor:
          type: integer
          minimum: 0
          description: KES minor units.
        penalty_rate_bp:
          type: integer
          maximum: 10000
          minimum: 0
          description: Basis points of the amount due (1% = 100).
        loan_multiplier:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          description: Max loan = this x member savings.
        interest_method:
          $ref: '#/components/schemas/InterestMethodEnum'
        interest_rate_bp:
          type: integer
          maximum: 10000
          minimum: 0
          description: Per month, basis points.
        max_loan_months:
          type: integer
          maximum: 60
          minimum: 1
        payment_channel:
          allOf:
          - $ref: '#/components/schemas/PaymentChannelEnum'
          description: |-
            paybill is recommended: till payments carry no member code.

            * `paybill` - paybill
            * `till` - till
        version:
          type: integer
        updated_at:
          type: string
          format: date-time
        updated_by_user_id:
          type: string
          format: uuid
          nullable: true
      required:
      - contribution_amount_minor
      - contribution_frequency
      - due_day
      - grace_days
      - interest_method
      - interest_rate_bp
      - loan_multiplier
      - max_loan_months
      - payment_channel
      - penalty_flat_minor
      - penalty_rate_bp
      - penalty_type
      - updated_at
      - updated_by_user_id
      - version
    ContributionFrequencyEnum:
      enum:
      - weekly
      - monthly
      type: string
      description: |-
        * `weekly` - weekly
        * `monthly` - monthly
    CreateChamaRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - name
    CreatedChama:
      type: object
      properties:
        chama_id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        member_code:
          type: string
        active_chama_id:
          type: string
          format: uuid
          description: The new chama; now active.
      required:
      - active_chama_id
      - chama_id
      - member_code
      - name
      - role
    CycleStatusEnum:
      enum:
      - paid
      - due
      - overdue
      - none
      type: string
      description: |-
        * `paid` - paid
        * `due` - due
        * `overdue` - overdue
        * `none` - none
    DeviceList:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceOut'
      required:
      - devices
    DeviceOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: The device this request comes from.
      required:
      - created_at
      - current
      - id
