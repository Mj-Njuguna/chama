openapi: 3.0.3
info:
  title: Chama API
  version: 0.1.0
  description: API consumed by the Chama mobile app. The TypeScript client is generated
    from this schema.
paths:
  /api/v1/auth/devices:
    get:
      operationId: auth_devices_list
      description: The caller's devices (not revoked), most recently seen first.
      tags:
      - auth
      security:
      - bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_token, token_expired, session_revoked, session_expired,
            refresh_reused
  /api/v1/auth/devices/{device_id}:
    delete:
      operationId: auth_devices_revoke
      description: 'Revoke one of the caller''s devices: its sessions end and its
        push token is revoked.'
      parameters:
      - in: path
        name: device_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - bearerSession: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_token, token_expired, session_revoked, session_expired,
            refresh_reused
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
  /api/v1/auth/logout:
    post:
      operationId: auth_logout
      description: End this session.
      tags:
      - auth
      security:
      - bearerSession: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_token, token_expired, session_revoked, session_expired,
            refresh_reused
  /api/v1/auth/logout-all:
    post:
      operationId: auth_logout_all
      description: End every session of this user, on every device.
      tags:
      - auth
      security:
      - bearerSession: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_token, token_expired, session_revoked, session_expired,
            refresh_reused
  /api/v1/auth/otp/request:
    post:
      operationId: auth_otp_request
      description: Send a one-time code to a phone number. The same response for every
        number.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequested'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_phone, validation_error
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited, locked
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: service_unavailable
  /api/v1/auth/otp/verify:
    post:
      operationId: auth_otp_verify
      description: Verify the code, bind the device, start a session and return its
        tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_code, validation_error
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: locked
  /api/v1/auth/pin:
    put:
      operationId: auth_pin_set
      description: Set the first server PIN (needs a fresh OTP on this session).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
        required: true
      security:
      - bearerSession: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: pin_rejected, validation_error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_token, token_expired, session_revoked, session_expired,
            refresh_reused
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: step_up_required
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: pin_already_set
  /api/v1/auth/pin/change:
    post:
      operationId: auth_pin_change
      description: Change the server PIN; needs the current one.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinChangeRequest'
        required: true
      security:
      - bearerSession: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_pin, pin_rejected
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_token, token_expired, session_revoked, session_expired,
            refresh_reused
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: step_up_required, pin_not_set
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: pin_locked, rate_limited
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: service_unavailable
  /api/v1/auth/pin/forgot:
    post:
      operationId: auth_pin_forgot
      description: |-
        Forgot PIN: request a new PIN. Needs a fresh step-up OTP; completes only after the
        cooling-off. The current PIN keeps working; other devices are alerted.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
        required: true
      security:
      - bearerSession: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinReset'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: pin_rejected, validation_error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_token, token_expired, session_revoked, session_expired,
            refresh_reused
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: step_up_required, pin_not_set, cooling_off
  /api/v1/auth/pin/forgot/cancel:
    post:
      operationId: auth_pin_forgot_cancel
      description: Cancel the waiting reset from any signed-in device; no step-up.
      tags:
      - auth
      security:
      - bearerSession: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_token, token_expired, session_revoked, session_expired,
            refresh_reused
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found (no reset is waiting)
  /api/v1/auth/pin/forgot/complete:
    post:
      operationId: auth_pin_forgot_complete
      description: Complete the reset after the cooling-off, with a fresh step-up
        OTP.
      tags:
      - auth
      security:
      - bearerSession: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_token, token_expired, session_revoked, session_expired,
            refresh_reused
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: step_up_required, cooling_off, chama_frozen
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found (no reset is waiting)
  /api/v1/auth/push-token:
    put:
      operationId: auth_push_token_set
      description: This device's push token. Stored only; nothing is sent yet.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenRequest'
        required: true
      security:
      - bearerSession: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: validation_error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_token, token_expired, session_revoked, session_expired,
            refresh_reused
    delete:
      operationId: auth_push_token_delete
      description: This device's push token. Stored only; nothing is sent yet.
      tags:
      - auth
      security:
      - bearerSession: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_token, token_expired, session_revoked, session_expired,
            refresh_reused
  /api/v1/auth/step-up/otp/request:
    post:
      operationId: auth_step_up_otp_request
      description: Send a code to the caller's own number for step-up (same limits
        as login codes).
      tags:
      - auth
      security:
      - bearerSession: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequested'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_token, token_expired, session_revoked, session_expired,
            refresh_reused
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited, locked
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: service_unavailable
  /api/v1/auth/step-up/otp/verify:
    post:
      operationId: auth_step_up_otp_verify
      description: 'Verify the step-up code: this session''s OTP factor is fresh for
        5 minutes.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpOtpVerifyRequest'
        required: true
      security:
      - bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreshFactor'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_code, validation_error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_token, token_expired, session_revoked, session_expired,
            refresh_reused
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: locked
  /api/v1/auth/step-up/pin:
    post:
      operationId: auth_step_up_pin
      description: 'Verify the server PIN: this session''s PIN factor is fresh for
        15 minutes.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
        required: true
      security:
      - bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreshFactor'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_pin
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_token, token_expired, session_revoked, session_expired,
            refresh_reused
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: step_up_required, pin_not_set
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: pin_locked, rate_limited
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: service_unavailable
  /api/v1/auth/switch-chama:
    post:
      operationId: auth_switch_chama
      description: Make one of your chamas the session's active chama.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchChamaRequest'
        required: true
      security:
      - bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwitchedChama'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: validation_error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated, invalid_token, token_expired, session_revoked,
            session_expired
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: chama_not_available
  /api/v1/auth/token/refresh:
    post:
      operationId: auth_token_refresh
      description: Rotate the refresh token. The previous token, within the grace
        window, gets the same pair.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_token, token_expired, session_revoked, session_expired,
            refresh_reused
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited (per IP)
  /api/v1/chama/changes:
    get:
      operationId: chama_changes_list
      description: Open cooling-off changes of the active chama (officials).
      tags:
      - chama
      security:
      - bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingChanges'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated, invalid_token, token_expired, session_revoked,
            session_expired
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: permission_denied, step_up_required, pin_not_set, chama_frozen,
            cooling_off
  /api/v1/chama/changes/{change_id}/cancel:
    post:
      operationId: chama_changes_cancel
      description: Cancel an open change. Any official; no step-up, even while the
        chama is frozen.
      parameters:
      - in: path
        name: change_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chama
      security:
      - bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingChange'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated, invalid_token, token_expired, session_revoked,
            session_expired
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: permission_denied, step_up_required, pin_not_set, chama_frozen,
            cooling_off
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found (no open change)
  /api/v1/chama/constitution:
    get:
      operationId: chama_constitution
      description: The active chama's rules. Every member reads; officials change
        with a fresh PIN.
      tags:
      - chama
      security:
      - bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstitutionOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated, invalid_token, token_expired, session_revoked,
            session_expired
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: chama_not_available
    patch:
      operationId: chama_constitution_update
      description: The active chama's rules. Every member reads; officials change
        with a fresh PIN.
      tags:
      - chama
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedConstitutionRequest'
      security:
      - bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstitutionOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: validation_error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated, invalid_token, token_expired, session_revoked,
            session_expired
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: permission_denied, step_up_required, pin_not_set, chama_frozen,
            cooling_off
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: chama_not_available
  /api/v1/chama/freeze:
    post:
      operationId: chama_freeze
      description: |-
        "This wasn't me": freeze the chama. Any official, no step-up; idempotent. Cancels every
        open change and alerts every official; only an operator can unfreeze, after review.
      tags:
      - chama
      security:
      - bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Frozen'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated, invalid_token, token_expired, session_revoked,
            session_expired
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: permission_denied, step_up_required, pin_not_set, chama_frozen,
            cooling_off
  /api/v1/chama/home:
    get:
      operationId: chama_home
      description: |-
        The home dashboard of the active chama: the caller's own figures, plus group figures for
        officials.
      tags:
      - chama
      security:
      - bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChamaHome'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: chama_not_available
  /api/v1/chama/invitations:
    post:
      operationId: chama_invite
      description: Invite one person by phone number. Officials, with a fresh OTP.
      tags:
      - chama
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
        required: true
      security:
      - bearerSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: validation_error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated, invalid_token, token_expired, session_revoked,
            session_expired
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: permission_denied, step_up_required, pin_not_set, chama_frozen,
            cooling_off
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: chama_not_available
  /api/v1/chama/members:
    get:
      operationId: chama_members
      description: The roster. Officials also see invitations and phone numbers.
      tags:
      - chama
      security:
      - bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Members'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated, invalid_token, token_expired, session_revoked,
            session_expired
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: permission_denied, step_up_required, pin_not_set, chama_frozen,
            cooling_off
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: chama_not_available
  /api/v1/chama/members/{membership_id}:
    patch:
      operationId: chama_member_update
      description: Change a member's role (chair, fresh OTP) or remove them (officials,
        fresh OTP).
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chama
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChangeRoleRequest'
      security:
      - bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: validation_error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated, invalid_token, token_expired, session_revoked,
            session_expired
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: permission_denied, step_up_required, pin_not_set, chama_frozen,
            cooling_off
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found, chama_not_available
    delete:
