openapi: 3.0.3
info:
  title: Chama API (DRAFT, phase 2)
  version: 0.2.0-draft
  description: >-
    DRAFT contract for the phase-2 endpoints, written from the phase-2 brief while the backend is
    built. Replaced by the generated backend schema at merge; only src/api/draftM2.ts uses it.
paths:
  /api/v1/chama/payment-linking:
    get:
      operationId: chama_payment_linking
      security: [{ bearerSession: [] }]
      responses:
        '200':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/PaymentLinking' } } },
            description: '',
          }
        '403':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
    put:
      operationId: chama_payment_linking_update
      security: [{ bearerSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PaymentLinkingUpdate' } } }
      responses:
        '200':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/PaymentLinking' } } },
            description: '',
          }
        '400':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
        '403':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
  /api/v1/chama/payments/stk:
    post:
      operationId: chama_payments_stk_create
      security: [{ bearerSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StkCreate' } } }
      responses:
        '202':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/StkRequest' } } },
            description: '',
          }
        '400':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
        '409':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: 'state_conflict payments_not_linked',
          }
        '429':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
  /api/v1/chama/payments/stk/{stk_request_id}:
    get:
      operationId: chama_payments_stk_status
      security: [{ bearerSession: [] }]
      parameters:
        - { in: path, name: stk_request_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/StkRequest' } } },
            description: '',
          }
        '404':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
  /api/v1/chama/payments:
    get:
      operationId: chama_payments
      security: [{ bearerSession: [] }]
      parameters:
        - { in: query, name: mine, required: false, schema: { type: boolean } }
      responses:
        '200':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/PaymentList' } } },
            description: '',
          }
  /api/v1/chama/payments/unallocated:
    get:
      operationId: chama_payments_unallocated
      security: [{ bearerSession: [] }]
      responses:
        '200':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/UnallocatedList' } } },
            description: '',
          }
        '403':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
  /api/v1/chama/payments/{payment_id}/allocate:
    post:
      operationId: chama_payment_allocate
      security: [{ bearerSession: [] }]
      parameters:
        - { in: path, name: payment_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AllocateRequest' } } }
      responses:
        '200':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } },
            description: '',
          }
        '403':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
        '409':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
  /api/v1/chama/cycles/current:
    get:
      operationId: chama_cycle_current
      security: [{ bearerSession: [] }]
      responses:
        '200':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Cycle' } } },
            description: '',
          }
        '404':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: 'no cycle yet',
          }
  /api/v1/chama/obligations:
    get:
      operationId: chama_obligations
      security: [{ bearerSession: [] }]
      parameters:
        - {
            in: query,
            name: member,
            required: false,
            schema: { type: string },
            description: 'me or a membership id (officials)',
          }
      responses:
        '200':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/ObligationList' } } },
            description: '',
          }
        '403':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
  /api/v1/chama/collection:
    get:
      operationId: chama_collection
      security: [{ bearerSession: [] }]
      responses:
        '200':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Collection' } } },
            description: '',
          }
        '403':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
        '404':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
  /api/v1/chama/statement:
    get:
      operationId: chama_statement
      security: [{ bearerSession: [] }]
      parameters:
        - { in: query, name: member, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Statement' } } },
            description: '',
          }
  /api/v1/chama/cashbook:
    get:
      operationId: chama_cashbook
      security: [{ bearerSession: [] }]
      responses:
        '200':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Cashbook' } } },
            description: '',
          }
        '403':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
  /api/v1/chama/fines/{obligation_id}/waive:
    post:
      operationId: chama_fine_waive
      security: [{ bearerSession: [] }]
      parameters:
        - { in: path, name: obligation_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WaiveRequest' } } }
      responses:
        '201':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Waiver' } } },
            description: '',
          }
        '403':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
        '409':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
  /api/v1/chama/waivers:
    get:
      operationId: chama_waivers
      security: [{ bearerSession: [] }]
      parameters:
        - {
            in: query,
            name: status,
            required: false,
            schema: { $ref: '#/components/schemas/WaiverStatusEnum' },
          }
      responses:
        '200':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/WaiverList' } } },
            description: '',
          }
        '403':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
  /api/v1/chama/waivers/{waiver_id}/approve:
    post:
      operationId: chama_waiver_approve
      security: [{ bearerSession: [] }]
      parameters:
        - { in: path, name: waiver_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Waiver' } } },
            description: '',
          }
        '403':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
        '409':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
            description: '',
          }
  /api/v1/chama/feed:
    get:
      operationId: chama_feed
      security: [{ bearerSession: [] }]
      parameters:
        - { in: query, name: cursor, required: false, schema: { type: string } }
      responses:
        '200':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/FeedPage' } } },
            description: '',
          }
  /api/v1/chama/membership:
    get:
      operationId: chama_membership
      description: "DRAFT addition (not in the phase-2 brief): the caller's own membership preferences."
      security: [{ bearerSession: [] }]
      responses:
        '200':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/MembershipPreferences' } } },
            description: '',
          }
    patch:
      operationId: chama_membership_update
      security: [{ bearerSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MembershipPreferences' } } }
      responses:
        '200':
          {
            content: { application/json: { schema: { $ref: '#/components/schemas/MembershipPreferences' } } },
            description: '',
          }
components:
  securitySchemes:
    bearerSession: { type: http, scheme: bearer }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            reason: { type: string }
          required: [code, message]
      required: [error]
    PaymentChannelEnum: { type: string, enum: [paybill, till] }
    LinkingEnvironmentEnum: { type: string, enum: [sandbox, production] }
    LinkingStatusEnum: { type: string, enum: [not_linked, pending, active] }
    PaymentLinking:
      type: object
      properties:
        channel: { allOf: [{ $ref: '#/components/schemas/PaymentChannelEnum' }], nullable: true }
        shortcode: { type: string, nullable: true }
        environment: { allOf: [{ $ref: '#/components/schemas/LinkingEnvironmentEnum' }], nullable: true }
        credentials_set: { type: boolean }
        status: { $ref: '#/components/schemas/LinkingStatusEnum' }
      required: [channel, shortcode, environment, credentials_set, status]
    PaymentLinkingUpdate:
      type: object
      properties:
        channel: { $ref: '#/components/schemas/PaymentChannelEnum' }
        shortcode: { type: string }
        consumer_key: { type: string, writeOnly: true }
        consumer_secret: { type: string, writeOnly: true }
        passkey: { type: string, writeOnly: true }
        environment: { $ref: '#/components/schemas/LinkingEnvironmentEnum' }
      required: [channel, shortcode, consumer_key, consumer_secret, passkey, environment]
    StkCreate:
      type: object
      properties:
        amount_minor: { type: integer, minimum: 1 }
      required: [amount_minor]
    StkStatusEnum: { type: string, enum: [pending, succeeded, failed, cancelled, timeout] }
    StkRequest:
      type: object
      properties:
        stk_request_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StkStatusEnum' }
        amount_minor: { type: integer }
        mpesa_receipt: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
      required: [stk_request_id, status, amount_minor, mpesa_receipt, created_at]
    PaymentSourceEnum: { type: string, enum: [c2b, stk] }
    PaymentStatusEnum: { type: string, enum: [allocated, unallocated] }
    Payment:
      type: object
      properties:
        payment_id: { type: string, format: uuid }
        member_id: { type: string, format: uuid, nullable: true }
        amount_minor: { type: integer }
        mpesa_receipt: { type: string }
        received_at: { type: string, format: date-time }
        source: { $ref: '#/components/schemas/PaymentSourceEnum' }
        status: { $ref: '#/components/schemas/PaymentStatusEnum' }
      required: [payment_id, member_id, amount_minor, mpesa_receipt, received_at, source, status]
    PaymentList:
      type: object
      properties:
        payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
      required: [payments]
    Suggestion:
      type: object
      properties:
        member_id: { type: string, format: uuid }
        reason: { type: string }
      required: [member_id, reason]
    UnallocatedPayment:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          properties:
            payer_masked: { type: string, nullable: true }
            bill_ref: { type: string, nullable: true }
            suggestions: { type: array, items: { $ref: '#/components/schemas/Suggestion' } }
          required: [payer_masked, bill_ref, suggestions]
    UnallocatedList:
      type: object
      properties:
        payments: { type: array, items: { $ref: '#/components/schemas/UnallocatedPayment' } }
      required: [payments]
    AllocateRequest:
      type: object
      properties:
        member_id: { type: string, format: uuid }
      required: [member_id]
    CycleStateEnum: { type: string, enum: [open, closed] }
    Cycle:
      type: object
      properties:
        cycle_id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        due_date: { type: string, format: date }
        grace_until: { type: string, format: date }
        amount_minor: { type: integer }
        status: { $ref: '#/components/schemas/CycleStateEnum' }
      required: [cycle_id, period_start, due_date, grace_until, amount_minor, status]
    ObligationKindEnum: { type: string, enum: [contribution, fine] }
    ObligationStatusEnum: { type: string, enum: [open, paid, waived] }
    Obligation:
      type: object
      properties:
        obligation_id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ObligationKindEnum' }
        due_date: { type: string, format: date }
        amount_minor: { type: integer }
        paid_minor: { type: integer }
        balance_minor: { type: integer }
        status: { $ref: '#/components/schemas/ObligationStatusEnum' }
      required: [obligation_id, kind, due_date, amount_minor, paid_minor, balance_minor, status]
    ObligationList:
      type: object
      properties:
        obligations: { type: array, items: { $ref: '#/components/schemas/Obligation' } }
      required: [obligations]
    CollectionStatusEnum: { type: string, enum: [paid, partial, unpaid, overdue] }
    CollectionMember:
      type: object
      properties:
        member_id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/CollectionStatusEnum' }
        balance_minor: { type: integer }
      required: [member_id, name, status, balance_minor]
    Collection:
      type: object
      properties:
        cycle_id: { type: string, format: uuid }
        members: { type: array, items: { $ref: '#/components/schemas/CollectionMember' } }
      required: [cycle_id, members]
    StatementEntry:
      type: object
      properties:
        transaction_id: { type: string, format: uuid }
        kind: { type: string }
        memo: { type: string }
        created_at: { type: string, format: date-time }
        amount_minor: { type: integer, description: 'Signed, as the server presents it for the member.' }
        account: { type: string }
      required: [transaction_id, kind, memo, created_at, amount_minor, account]
    Statement:
      type: object
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/StatementEntry' } }
      required: [entries]
    CashbookTransaction:
      type: object
      properties:
        transaction_id: { type: string, format: uuid }
        kind: { type: string }
        memo: { type: string }
        created_at: { type: string, format: date-time }
        cash_minor: { type: integer }
      required: [transaction_id, kind, memo, created_at, cash_minor]
    Cashbook:
      type: object
      properties:
        balance_minor: { type: integer }
        transactions: { type: array, items: { $ref: '#/components/schemas/CashbookTransaction' } }
      required: [balance_minor, transactions]
    WaiveRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 200 }
      required: [reason]
    WaiverStatusEnum: { type: string, enum: [pending, approved] }
    Waiver:
      type: object
      properties:
        waiver_id: { type: string, format: uuid }
        obligation_id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        amount_minor: { type: integer }
        reason: { type: string }
        requested_by_member_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/WaiverStatusEnum' }
        created_at: { type: string, format: date-time }
      required:
        [
          waiver_id,
          obligation_id,
          member_id,
          amount_minor,
          reason,
          requested_by_member_id,
          status,
          created_at,
        ]
    WaiverList:
      type: object
      properties:
        waivers: { type: array, items: { $ref: '#/components/schemas/Waiver' } }
      required: [waivers]
    FeedEvent:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        kind: { type: string }
        created_at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
      required: [event_id, kind, created_at, payload]
    FeedPage:
      type: object
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/FeedEvent' } }
        next_cursor: { type: string, nullable: true }
      required: [events, next_cursor]
    MembershipPreferences:
      type: object
      properties:
        scheduled_stk_opt_in: { type: boolean }
      required: [scheduled_stk_opt_in]
